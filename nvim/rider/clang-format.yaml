# C / C++ formatting that mirrors JetBrains Rider (ReSharper C++) defaults.
# Used by conform.nvim via --style=file:<this file>. Edit here, not in init.lua.
---
Language: Cpp
BasedOnStyle: Microsoft

# Indentation: 4 spaces, never tabs; continuation lines also 4.
UseTab: Never
IndentWidth: 4
TabWidth: 4
ContinuationIndentWidth: 4
AccessModifierOffset: -4
IndentCaseLabels: true
NamespaceIndentation: All
IndentPPDirectives: BeforeHash

# Right margin.
ColumnLimit: 120

# Braces on their own line (Allman), like Rider.
BreakBeforeBraces: Allman
AllowShortBlocksOnASingleLine: Never
AllowShortIfStatementsOnASingleLine: Never
AllowShortLoopsOnASingleLine: false
AllowShortCaseLabelsOnASingleLine: false
AllowShortFunctionsOnASingleLine: Empty
AllowShortEnumsOnASingleLine: false

# Line breaking / alignment.
AlignAfterOpenBracket: Align
BinPackArguments: true
BinPackParameters: true
BreakBeforeBinaryOperators: None
BreakBeforeTernaryOperators: false
AlwaysBreakTemplateDeclarations: Yes
BreakConstructorInitializers: BeforeColon
PackConstructorInitializers: NextLine

# Spacing.
PointerAlignment: Left
ReferenceAlignment: Left
SpaceBeforeParens: ControlStatements
SpaceAfterCStyleCast: false
SpacesInParentheses: false
SpacesBeforeTrailingComments: 1
Cpp11BracedListStyle: false

# Blank lines / includes: keep what the author wrote, like Rider.
MaxEmptyLinesToKeep: 1
KeepEmptyLinesAtTheStartOfBlocks: false
SortIncludes: Never
FixNamespaceComments: false
