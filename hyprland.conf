# Shell — Hyprland integration
#
#   source = ~/quickshellProjects/hyprland.conf
#
# from your hyprland.conf. Everything below assumes the shell is reachable as
# the named config "shell":
#
#   mkdir -p ~/.config/quickshell
#   ln -sfn ~/quickshellProjects ~/.config/quickshell/shell

# The shell runs as its own user unit rather than as a child of the compositor.
# Capped, so a shell that runs away is killed and restarted instead of dragging
# the whole machine into swap — it once grew at ~85 MB/s until the power button
# was the only way out. Logged to the journal (`journalctl --user -u
# quickshell`), which survives that reboot where /run/user does not. The
# variables Hyprland sets are passed through by name, so the unit never sees
# the user manager's copy from before this session.
exec-once = systemd-run --user --unit=quickshell --collect -p PartOf=graphical-session.target -p Restart=on-failure -p RestartSec=1 -p MemoryMax=1536M -p MemorySwapMax=0 -E WAYLAND_DISPLAY -E HYPRLAND_INSTANCE_SIGNATURE -E XCURSOR_SIZE -E HYPRCURSOR_SIZE qs -c shell

# ------------------------------------------------------------------ overview
#
# The workspace overview is the hyprexpo compositor plugin, not a shell surface:
# only the compositor can render live workspace contents. Build it with
# tools/build-overview-plugin.sh, and re-run that after every Hyprland update —
# Hyprland refuses to load a plugin built against different headers.

plugin = $HOME/.local/share/hyprexpo/hyprexpo.so

plugin:hyprexpo {
    columns = 3
    gaps_in = 10
    # Room around the grid on every side, so tiles never meet the screen's
    # edges. The tiles keep the screen's shape, so the axis the grid fills
    # first gets this and the other gets what is left over.
    gaps_out = 24
    # Every workspace, even empty ones, so the overview opens with a single one too.
    skip_empty = 0
    dynamic_grid = 1
    workspace_method = center current
    show_workspace_numbers = 1
    show_cursor = 1
    # The wallpaper, blurred, behind the tiles. That it is the real one (hyprpaper's)
    # rather than Hyprland's stock asset, and blurred, is the build script's patch.
    wallpaper_bg = 1
    # Three fingers up opens the overview and down closes it, as on GNOME; the
    # down half is tools/hyprexpo-swipe-open-close.patch.
    gesture_fingers = 3
    gesture_direction = up
}
# bg_col, the tile borders (colours, and a width of 0: a tile is highlighted by
# zooming into it, see tools/hyprexpo-tile-zoom-and-add-tile.patch) and
# tile_rounding are pushed by the shell so the overview follows the theme and
# the roundness setting; see modules/common/OverviewTheme.qml.

# --------------------------------------------------------------------- keys
#
# The shell registers these over the hyprland-global-shortcuts protocol, so the
# binds below cost nothing at press time — no process is spawned.

bind = SUPER, R, global, shell:launcher
# Straight to the compositor: works even when the shell is not running.
bind = SUPER, Tab, hyprexpo:expo, toggle
bind = SUPER, S, global, shell:quickSettings
bind = SUPER, N, global, shell:dateMenu
bind = SUPER, comma, global, shell:settings
bind = SUPER, L, global, shell:lock
bind = SUPER SHIFT, T, global, shell:toggleTheme
bind = SUPER SHIFT, N, global, shell:toggleDnd

# Popups close on a click outside them. `bindn` is non-consuming, so the click
# still reaches whatever is under it and the desktop stays fully interactive
# while a popup is open — the shell only listens, it never captures the pointer.
bindn = , mouse:272, global, shell:dismiss
bindn = , mouse:273, global, shell:dismiss
bindn = , ESCAPE, global, shell:escapeKey

# Print is what Fn+P sends on a keyboard without a dedicated key.
bind = , Print, global, shell:screenshotRegion
bind = SHIFT, Print, global, shell:screenshot

# bindl keeps these working while the session is locked.
bindl = , XF86AudioRaiseVolume, global, shell:volumeUp
bindl = , XF86AudioLowerVolume, global, shell:volumeDown
bindl = , XF86AudioMute, global, shell:volumeMute
bindl = , XF86AudioMicMute, global, shell:micMute
bindl = , XF86MonBrightnessUp, global, shell:brightnessUp
bindl = , XF86MonBrightnessDown, global, shell:brightnessDown
bindl = , XF86AudioPlay, global, shell:playPause
bindl = , XF86AudioNext, global, shell:next
bindl = , XF86AudioPrev, global, shell:previous

# ------------------------------------------------------------------- layout
#
# The bar and the dock reserve their own space through layer-shell exclusive
# zones, so no manual gaps are needed. These only affect the shell's own
# surfaces; they are named "shell-<surface>".

# Hyprland 0.56 takes layer rules as a block. The name in brackets only names
# the rule: what it applies to is its match:namespace, a regex the whole
# namespace has to match, and a rule with no match applies to nothing at all (verified in the 0.56.2 source; these two once sat
# here without one and never took effect).

# Glass. Every shell surface is blurred behind wherever it is more than half
# opaque. The panels are drawn at the theme's glass opacity, well above that, and
# the shadows around them well below it, so the frost stops at a panel's edge —
# a popup's surface is mostly empty, and none of the empty part is blurred.
layerrule[shell-glass] {
    match:namespace = shell-.*
    blur = on
    ignore_alpha = 0.5
}

layerrule[shell-launcher] {
    match:namespace = shell-launcher
    animation = fade
}

layerrule[shell-osd] {
    match:namespace = shell-osd
    animation = none
}
