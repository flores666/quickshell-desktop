# Shell — Hyprland integration
#
#   source = ~/.config/quickshell/shell/hyprland.conf
#
# from the desktop's Hyprland config, hypr/conf.d/90-quickshell.conf. Everything
# below assumes the shell is reachable as the named config "shell", which
# install.sh sets up: ~/.config/quickshell/shell links to this checkout.

# The shell runs as its own user unit rather than as a child of the compositor.
# Capped, so a shell that runs away is killed and restarted instead of dragging
# the whole machine into swap — it once grew at ~85 MB/s until the power button
# was the only way out. Logged to the journal (`journalctl --user -u
# quickshell`), which survives that reboot where /run/user does not. The
# variables Hyprland sets are passed through by name, so the unit never sees
# the user manager's copy from before this session. The log rule silences Qt
# warning, on every popup close, that it is disabling text input for a surface
# the compositor never gave text input; see AGENTS.md. QML_IMPORT_PATH is where
# the shell's native module is (tools/build-native-module.sh), rebuilt by the
# second line after a Qt update; a shell without it still runs.
exec-once = systemd-run --user --unit=quickshell --collect -p PartOf=graphical-session.target -p Restart=on-failure -p RestartSec=1 -p MemoryMax=1536M -p MemorySwapMax=0 -E WAYLAND_DISPLAY -E HYPRLAND_INSTANCE_SIGNATURE -E XCURSOR_SIZE -E HYPRCURSOR_SIZE -E QML_IMPORT_PATH=$HOME/.local/share/quickshell-desktop/qml qs -c shell --log-rules qt.qpa.wayland.textinput.warning=false
exec-once = systemd-cat -t quickshell-native ~/.config/quickshell/shell/tools/build-native-module.sh --if-stale

# ------------------------------------------------------------------ overview
#
# The workspace overview is the hyprexpo compositor plugin, not a shell surface:
# only the compositor can render live workspace contents. install.sh builds it
# with tools/build-overview-plugin.sh, and Hyprland refuses to load a plugin
# built against different headers, so the exec-once below rebuilds it after
# every Hyprland update.

plugin = $HOME/.local/share/hyprexpo/hyprexpo.so
# After a Hyprland update the line above fails until the plugin is rebuilt
# against it; this rebuilds it in the background, loads it and says so.
exec-once = systemd-cat -t hyprexpo ~/.config/quickshell/shell/tools/build-overview-plugin.sh --if-stale

plugin:hyprexpo {
    columns = 3
    gaps_in = 10
    # Room around the grid on every side, so tiles never meet the screen's
    # edges, past what the bar and a dock that stays out reserve: they are
    # drawn over the overview where they stand (see the build script's
    # fourth patch). The tiles keep the screen's shape, so the axis the grid
    # fills first gets this and the other gets what is left over.
    gaps_out = 24
    # Every workspace, even empty ones, so the overview opens with a single one too.
    skip_empty = 0
    dynamic_grid = 1
    workspace_method = center current
    show_workspace_numbers = 1
    show_cursor = 1
    # The wallpaper, blurred, behind the tiles. That it is the real one (hyprpaper's)
    # rather than Hyprland's stock asset, and blurred, is the build script's patch.
    wallpaper_bg = 1
    # Three fingers up opens the overview and down closes it, as on GNOME; the
    # down half is tools/hyprexpo-swipe-open-close.patch.
    gesture_fingers = 3
    gesture_direction = up
}
# bg_col, the tile borders (colours, and a width of 0: a tile is highlighted by
# zooming into it, see tools/hyprexpo-tile-zoom-and-add-tile.patch) and
# tile_rounding are pushed by the shell so the overview follows the theme and
# the roundness setting; see modules/common/CompositorTheme.qml.

# ------------------------------------------------------------------ windows
#
# The window plugin, built from hypr/windows. Title bars: macOS-style, for
# every window whose client does not draw its own frame — above a floating
# window, over a tiled one's top while the pointer is there, none in
# fullscreen; their colours are pushed by the shell (CompositorTheme.qml), the
# dock's menu hides them per application, and `decorate = off` in a window
# rule leaves one window without a bar. Placement: windows open
# floating (the float-by-default rule in conf.d/80-window-rules.conf), each
# application as it was last left, tiled or floating at its size, kept in
# ~/.local/state/hypr-windows. After the overview's line, so that a pointer
# the overview takes is not the bars' too. Rebuilt after a Hyprland update
# like the overview.

plugin = $HOME/.local/share/hypr-windows/windows.so
exec-once = systemd-cat -t hypr-windows ~/.config/quickshell/shell/tools/build-windows-plugin.sh --if-stale

# --------------------------------------------------------------------- keys
#
# The shell registers these over the hyprland-global-shortcuts protocol, so the
# binds below cost nothing at press time — no process is spawned.

bind = SUPER, R, global, shell:launcher
# Straight to the compositor: works even when the shell is not running.
bind = SUPER, Tab, hyprexpo:expo, toggle

# Alt+Tab goes round the windows of the workspace, as Command-Tab does on
# macOS (services/Switcher.qml): the shell keeps the order and draws it,
# Hyprland holds the keys. Alt+Tab steps and enters the `switcher` submap,
# where Tab, Alt+` and the arrows step and Escape cancels — only while it is
# open; not Alt+Shift+Tab, since Alt+Shift switches the keyboard layout
# (60-input.conf). Letting go of Alt commits. A key's release is matched in the submap it
# was pressed in, and Alt went down before Tab, so those binds are the main
# map's: they fire on every Alt release, and the shell ignores the ones that
# end nothing. They are transparent (t): once another key goes down with Alt
# (Tab), Hyprland shadows every other bind on Alt's own key — how a
# `bindr = SUPER, SUPER_L` stays out of Super+key — and the submap was never
# left. Each pair runs the global first: Hyprland stops collecting a key's
# binds at the one that changes submap.
bind = ALT, Tab, global, shell:switcherNext
bind = ALT, Tab, submap, switcher
bindrt = ALT, ALT_L, global, shell:switcherCommit
bindrt = ALT, ALT_L, submap, reset
bindrt = ALT, ALT_R, global, shell:switcherCommit
bindrt = ALT, ALT_R, submap, reset

submap = switcher
bind = ALT, Tab, global, shell:switcherNext
bind = ALT, right, global, shell:switcherNext
bind = ALT, grave, global, shell:switcherBack
bind = ALT, left, global, shell:switcherBack
bind = ALT, Escape, global, shell:switcherCancel
bind = ALT, Escape, submap, reset
submap = reset

bind = SUPER, S, global, shell:quickSettings
bind = SUPER, N, global, shell:dateMenu
bind = SUPER, comma, global, shell:settings
bind = CTRL SHIFT, Escape, global, shell:taskManager
bind = SUPER, L, global, shell:lock
bind = SUPER SHIFT, T, global, shell:toggleTheme
bind = SUPER SHIFT, N, global, shell:toggleDnd

# Popups close on a click outside them. `bindn` is non-consuming, so the click
# still reaches whatever is under it and the desktop stays fully interactive
# while a popup is open — the shell only listens, it never captures the pointer.
bindn = , mouse:272, global, shell:dismiss
bindn = , mouse:273, global, shell:dismiss
bindn = , ESCAPE, global, shell:escapeKey

# Print is what Fn+P sends on a keyboard without a dedicated key.
bind = , Print, global, shell:screenshotRegion
bind = SHIFT, Print, global, shell:screenshot

# bindl keeps these working while the session is locked.
bindl = , XF86AudioRaiseVolume, global, shell:volumeUp
bindl = , XF86AudioLowerVolume, global, shell:volumeDown
bindl = , XF86AudioMute, global, shell:volumeMute
bindl = , XF86AudioMicMute, global, shell:micMute
bindl = , XF86MonBrightnessUp, global, shell:brightnessUp
bindl = , XF86MonBrightnessDown, global, shell:brightnessDown
bindl = , XF86AudioPlay, global, shell:playPause
bindl = , XF86AudioNext, global, shell:next
bindl = , XF86AudioPrev, global, shell:previous

# ------------------------------------------------------------------- layout
#
# The bar and the dock reserve their own space through layer-shell exclusive
# zones, so no manual gaps are needed. These only affect the shell's own
# surfaces; they are named "shell-<surface>".

# Hyprland 0.56 takes layer rules as a block. The name in brackets only names
# the rule: what it applies to is its match:namespace, a regex the whole
# namespace has to match, and a rule with no match applies to nothing at all (verified in the 0.56.2 source; these two once sat
# here without one and never took effect).

# Glass. Every shell surface is blurred behind wherever it is more than half
# opaque. The panels are drawn at the theme's glass opacity, well above that, and
# the shadows around them well below it, so the frost stops at a panel's edge —
# a popup's surface is mostly empty, and none of the empty part is blurred. The
# bar and the dock lay down a share of that glass the user sets; below about
# 57% of it they are clear, unblurred (Appearance.barOpacity).
layerrule[shell-glass] {
    match:namespace = shell-.*
    blur = on
    ignore_alpha = 0.5
}

# Popups draw their own coming and going, all in the one surface
# (modules/common/OverlaySurface), and one opened over another flies in from
# where that one was (OverlayCard). Hyprland would fade the surface in as it
# maps (fadeLayersIn), over the card's own fade.
layerrule[shell-popups] {
    match:namespace = shell-popups
    no_anim = on
}

# The window switcher's card fades and slides as a popup's does
# (modules/switcher/SwitcherWindow).
layerrule[shell-switcher] {
    match:namespace = shell-switcher
    no_anim = on
}

layerrule[shell-osd] {
    match:namespace = shell-osd
    animation = none
}

# Screenshots. A region shot freezes the screen under hyprpicker, its lens off,
# drags the rectangle out with slurp ("selection") over that, and has grim take
# the frozen frame; see services/Screenshot.qml. Neither fades: the selection's
# fade-out was still on screen when grim took the shot and framed every region
# in its border. A layer is drawn beneath every one of a lower order, so a toast
# or the OSD that opens meanwhile stays under the frozen screen, out of the shot.
layerrule[screenshot-freeze] {
    match:namespace = hyprpicker
    no_anim = on
    order = -1
}

layerrule[screenshot-selection] {
    match:namespace = selection
    no_anim = on
    order = -2
}
