################
### MONITORS ###
################

# Every screen is detected: its highest resolution at the highest refresh rate
# that resolution has (a 165 Hz panel runs at 165), placed beside the others,
# scaled for its pixel density. `highres` rather than `highrr`, which ranks the
# refresh rate first and would take a 4K screen down to 1080p for 120 Hz.
#
# How one machine's screens are arranged is that machine's, not the
# project's: it goes in its own ~/.config/hypr/hyprland.conf, after the line
# that sources this, as a rule keyed by desc: (make, model and serial, as
# `hyprctl monitors` prints them), which wins over this one.
monitor = , highres, auto, auto
