################
### MONITORS ###
################

# Each rule follows the monitor itself - desc: is its make, model and serial,
# as `hyprctl monitors` prints them - rather than the connector it is plugged
# into, so it holds on any machine and misfires on none where that connector
# is some other screen.

# MSI 24" on top, the laptop's own panel directly below it.
monitor = desc:Microstep MSI MP241X BA9H362A23559, preferred, 0x0, 1
monitor = desc:Lenovo Group Limited 0x9022, preferred, 0x1080, 1

# The desktop's monitor at its full 165 Hz. Still by connector, as its
# description has not been read on that machine: replace DP-3 with
# desc:<description> there.
monitor = DP-3, 1920x1080@165, 0x0, 1

# Anything else, wherever it is plugged in.
monitor = , preferred, auto, 1
