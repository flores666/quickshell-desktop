#########################
# quickshell-desktop
#########################
#
# The shell's own Hyprland integration: autostart, the overview plugin and the
# binds it answers.  Reachable as the named config "shell" through
# ~/.config/quickshell/shell, which install.sh links to the checkout.

source = ~/.config/quickshell/shell/hyprland.conf

# Super+S stays this session's scratchpad, so the shell gives it up: `unbind`
# drops both claims on the combination, and the scratchpad takes it back alone.
# Quick settings is still one click away on the bar's status indicators.
unbind = SUPER, S
bind = SUPER, S, togglespecialworkspace, magic
