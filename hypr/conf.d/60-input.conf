#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    # Alt+Shift and Super+Space both cycle the layout.
    kb_options = grp:alt_shift_toggle,grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    accel_profile=flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        disable_while_typing = true
    }
}

gesture = 3, horizontal, workspace

# Hyprland's defaults (300px of travel, a flick at 30 forces the switch) jump a
# workspace on the slightest swipe.
gestures {
    workspace_swipe_distance = 700
    workspace_swipe_min_speed_to_force = 60
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# The global flat profile keeps the mouse precise but makes the touchpad crawl;
# give the touchpad its own speed and acceleration.
device {
    name = msft0004:00-06cb:ce2c-touchpad
    sensitivity = 0.15
    accel_profile = adaptive
}
