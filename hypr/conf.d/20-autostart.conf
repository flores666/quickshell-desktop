#################
### AUTOSTART ###
#################

exec-once = hyprpaper
# The polkit agent, which asks for the password when an application needs
# administrator rights. Hyprland's own child rather than its packaged user
# unit: that one waits for WAYLAND_DISPLAY in systemd's environment, which
# Hyprland copies there by a process of its own, so a unit started at once
# could find it missing and never start; this inherits it directly, with or
# without uwsm.
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
# The task manager's tasks "At login" (systemd/quickshell-login.target), with
# the session's display in the user manager's environment first, so that a
# task, or one on a timer later, can open a window.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE && systemctl --user restart quickshell-login.target
#exec-once = hyprctl keyword debug:vfr false
