# kitty, in the Soft Surface look: a deep blue-black ground, a periwinkle
# accent and soft, cool text. install.sh includes this from your own
# kitty.conf, which keeps only what belongs to that machine: the font size,
# written by kitty-font-size (bin/), and whatever you add after the include.
# The prompt drawn on it is prompt.fish, beside this file, and neovim carries
# the same palette (`soft` in nvim/init.lua): change a colour in both.

# ----------------------------------------------------------------- the font

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto

disable_ligatures cursor
modify_font cell_width 100%
# A looser line than the font's own, so the prompt's pills have air around them.
modify_font cell_height 125%
box_drawing_scale 0.001, 1, 1.5, 2

# ---------------------------------------------------------------------- keys

# Ctrl+Backspace deletes the previous word.
map ctrl+backspace send_text all \x17

# Ctrl+= / Ctrl+- step the font size of every window by one point, with Shift
# by two, and kitty-font-size keeps it for new windows.
allow_remote_control yes
map --allow-fallback=shifted,ascii ctrl+equal launch --type=background --allow-remote-control kitty-font-size up
map --allow-fallback=shifted,ascii ctrl+plus launch --type=background --allow-remote-control kitty-font-size up
map --allow-fallback=shifted,ascii ctrl+kp_add launch --type=background --allow-remote-control kitty-font-size up
map --allow-fallback=shifted,ascii ctrl+shift+equal launch --type=background --allow-remote-control kitty-font-size up2
map --allow-fallback=shifted,ascii ctrl+shift+plus launch --type=background --allow-remote-control kitty-font-size up2
map --allow-fallback=shifted,ascii ctrl+shift+kp_add launch --type=background --allow-remote-control kitty-font-size up2
map --allow-fallback=shifted,ascii ctrl+minus launch --type=background --allow-remote-control kitty-font-size down
map --allow-fallback=shifted,ascii ctrl+kp_subtract launch --type=background --allow-remote-control kitty-font-size down
map --allow-fallback=shifted,ascii ctrl+shift+minus launch --type=background --allow-remote-control kitty-font-size down2
map --allow-fallback=shifted,ascii ctrl+shift+kp_subtract launch --type=background --allow-remote-control kitty-font-size down2

# -------------------------------------------------------------------- window

# No title bar: the window is only its content, rounded and shadowed by Hyprland.
hide_window_decorations yes
# In points: vertical, then horizontal.
window_padding_width 18 24

cursor_shape beam
cursor_beam_thickness 1.5

# -------------------------------------------------------------------- colour

foreground #c9ccd9
background #11141d
selection_foreground #e6e8f0
selection_background #334178
cursor #c9ccd9
cursor_text_color #11141d
url_color #7d93ee

active_border_color #334178
inactive_border_color #1f2336
bell_border_color #e9c98a

# The tab bar, at the bottom and only with two tabs or more, as pills too.
tab_bar_style powerline
tab_powerline_style round
tab_bar_background #11141d
active_tab_foreground #e6e8f0
active_tab_background #334178
inactive_tab_foreground #8a8fa6
inactive_tab_background #1f2336

# black, red, green, yellow, blue, magenta, cyan, white; each with its bright one
color0 #1f2336
color8 #5c6178
color1 #ee8a97
color9 #f4a3ad
color2 #9cd8a9
color10 #b4e4be
color3 #e9c98a
color11 #f0d7a4
color4 #7d93ee
color12 #9aaef5
color5 #b59af0
color13 #c9b4f6
color6 #7fc8e6
color14 #9dd8ee
color7 #c9ccd9
color15 #e6e8f0
