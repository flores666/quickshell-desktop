# kitty, in the Soft Surface look: a deep blue-black ground, a periwinkle
# accent and soft, cool text. install.sh includes this from your own
# kitty.conf, which keeps only what belongs to that machine: the font size,
# written by kitty-font-size (bin/), and whatever you add after the include.
# The prompt drawn on it is prompt.fish, beside this file; its colours, and
# neovim's, are palette.conf's.

# ----------------------------------------------------------------- the font

font_family JetBrainsMono Nerd Font Mono
# Prompt folder, home and branch: Phosphor Regular; pill caps use the text font.
symbol_map U+E24A,U+E278,U+E2C2 Phosphor
# The default for new windows; a machine can override it in font-size.conf.
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto

disable_ligatures cursor
modify_font cell_width 100%
# A looser line than the font's own, so the prompt's pills have air around them.
modify_font cell_height 125%
box_drawing_scale 0.001, 1, 1.5, 2

# ---------------------------------------------------------------------- keys

# Ctrl+Backspace deletes the previous word.
map ctrl+backspace send_text all \x17

# Ctrl+= / Ctrl+- step the current terminal window's font size by one point,
# with Shift by two. Other windows and the machine's default keep their size.
allow_remote_control yes
map --allow-fallback=shifted,ascii ctrl+equal change_font_size current +1
map --allow-fallback=shifted,ascii ctrl+plus change_font_size current +1
map --allow-fallback=shifted,ascii ctrl+kp_add change_font_size current +1
map --allow-fallback=shifted,ascii ctrl+shift+equal change_font_size current +2
map --allow-fallback=shifted,ascii ctrl+shift+plus change_font_size current +2
map --allow-fallback=shifted,ascii ctrl+shift+kp_add change_font_size current +2
map --allow-fallback=shifted,ascii ctrl+minus change_font_size current -1
map --allow-fallback=shifted,ascii ctrl+kp_subtract change_font_size current -1
map --allow-fallback=shifted,ascii ctrl+shift+minus change_font_size current -2
map --allow-fallback=shifted,ascii ctrl+shift+kp_subtract change_font_size current -2

# -------------------------------------------------------------------- window

# The frame is the compositor's: kitty asks for server-side decorations and
# draws none of its own, and the window plugin gives it its title bar. "yes"
# asks for client-side mode, which tells the plugin kitty draws its own.
hide_window_decorations no
# In points: vertical, then horizontal.
window_padding_width 18 24

cursor_shape beam
cursor_beam_thickness 1.5

# -------------------------------------------------------------------- colour

# Written once, in palette.conf; this prints kitty's share of it.
geninclude kitty-colors.py

# The tab bar, at the bottom and only with two tabs or more, as pills too.
tab_bar_style powerline
tab_powerline_style round
