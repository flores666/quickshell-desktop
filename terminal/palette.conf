# Soft Surface: the terminal's colours, written here and nowhere else. kitty
# takes them through kitty-colors.py, and the fish prompt (prompt.fish) and
# neovim (nvim/init.lua) read this file themselves. Every other line is a name
# and a colour, and nothing more. While the shell's accent follows the
# wallpaper, the lines of ~/.local/state/quickshell-desktop/palette.conf
# replace these (accent and accent_bright) for kitty and neovim.

# the ground, darkest first
bg #11141d
bg_alt #171a26
surface #1f2336
raised #2c314a
selection #334178
error_surface #4a2632

# text, faintest first
muted #5c6178
dim #8a8fa6
text_soft #b5bacd
fg #c9ccd9
bright #e6e8f0

# the accents, each beside its brighter one
accent #7d93ee
accent_bright #9aaef5
red #ee8a97
red_bright #f4a3ad
green #9cd8a9
green_bright #b4e4be
yellow #e9c98a
yellow_bright #f0d7a4
magenta #b59af0
magenta_bright #c9b4f6
cyan #7fc8e6
cyan_bright #9dd8ee
orange #f2b38f
